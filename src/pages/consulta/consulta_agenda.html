<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" />
    <link rel="stylesheet" href="../../shared/sidebar.css" />
    <link rel="stylesheet" href="consulta_agenda.css" />
    <link rel="stylesheet" href="../../shared/calendar.css">
    <title>Beleza de Atendimento</title>
  </head>
  <body>
    <button class="btn_back" onclick="location.href = '/pages/index.html'" > 
     <img src="../../assets/img/btn-back.svg" alt="voltar_para_inicio" width="30" height="30">
    </button>
    <div class="full_box" style="display: flex">
      <div class="barra_lat">
        <a onclick="location.href = '/pages/consulta/consulta_agenda.html'">
        <button class="btn_config">
        <img src="../../assets/img/icon-calendar.svg" alt="calendario">
        </button>
       </a>
       
        <a onclick="location.href = '/pages/agendamento/agendamento.html'">
        <button class="btn_config">
          <img src="../../assets/img/more.svg" alt="criar">
        </button>
        </a>
      </div>

      <main>
        <div class="consulting-box">

            <div class="left">
                <h1>Agenda</h1>
                <div class="day-select">
                    <p class="select-day-title">Dia selecionado:</p>
                    
                    <div class="show-full-date">
                        <div class="date" id="diaNumero">
                        </div>
                        <div class="name-date" id="diaSemana">
                        </div>
                    </div>
                </div>
                
                <div class="calendar">
                  <div class="calendar__header">
                    <button class="calendar__nav" onclick="mesAnterior()"><img src="../../assets/img/left-arrow.svg" alt="Left_Arrow" width="10px"></button>
                    <span class="calendar__month-year" id="mesAnoAtual">Fev 2026</span>
                    <button class="calendar__nav" onclick="proximoMes()"><img src="../../assets/img/right-arrow.svg" alt="Right_Arrow" width="10px"></button>
                  </div>
                  <div class="calendar__weekdays">
                    <span class="calendar__weekday">D</span>
                    <span class="calendar__weekday">S</span>
                    <span class="calendar__weekday">T</span>
                    <span class="calendar__weekday">Q</span>
                    <span class="calendar__weekday">Q</span>
                    <span class="calendar__weekday">S</span>
                    <span class="calendar__weekday">S</span>
                  </div>
                  <div class="calendar__days" id="diasMes"></div>
                </div>
            </div>
            <div class="linha-vertical" ></div>
            <div class="right">
              <div id="agenda" class="agenda"></div>
            </div>
            
        </div>
      </main>
      <script src="js/calendario.js"></script>
  </body>
</html>
