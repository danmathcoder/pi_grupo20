<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" />
    <link rel="stylesheet" href="agendamento.css" />
    <link rel="stylesheet" href="../../shared/sidebar.css" />

    <title>Beleza de Atendimento</title>
  </head>

  <body>
    <button class="btn_back" onclick="location.href = '../../pages/index.html'" > 
     <img src="../../assets/img/btn-back.svg" alt="voltar_para_inicio width="30" height="30">
    </button>
    <div class="full_box" style="display: flex">
      <div class="barra_lat">
         <a onclick="location.href = '../../pages/consulta/consulta_agenda.html'">
        <button class="btn_config">
         <img src="../../assets/img/icon-calendar.svg" alt="calendario">
        </button>
      </a>

      <a onclick="location.href = '../../pages/agendamento/agendamento.html'">
        <button class="btn_config">
          <img src="../../assets/img/more.svg" alt="criar">
        </button>
        </a>
      </div>
     <main class="content">
      <h1>Novo agendamento</h1>

      <div class="card">
        <form id="formulario">
          <div class="row">
            <div class="field">
              <label>Nome:</label>
              <input type="text" id="name" placeholder="Informe o nome aqui...">
            </div>

            <div class="field">
              <label>Sobrenome:</label>
              <input type="text"  id="fullname" placeholder="Informe o sobrenome aqui...">
            </div>
          </div>

          <div class="row">
            <div class="field">
              <label>Tipo do serviço:</label>
              <select id="serviceType">
                <option value="">Selecione...</option>
                <option class="option" value="Corte de cabelo">Corte de cabelo</option>
                <option class="option" value="Esmaltação">Esmaltação</option>
                <option class="option" value="Manicure">Manicure</option>
                <option class="option" value="Pedicure">Pedicure</option>
                <option class="option" value="Penteado">Penteado</option>
              </select>
            </div>

            <div class="field">
              <label>Data:</label>
              <input type="date" id="date" placeholder="00/00/0000">
            </div>

            <div class="field">
              <label>Horário:</label>
              <input type="time" id="time" min="08:00" max="18:00" placeholder="00:00">
            </div>
          </div>

          <div class="actions">
            <button type="submit" class="confirm" >Confirmar</button>
          </div>

        </form>
      </div>
    </main>
      </div>
    </div>
    <script src="js/regex.js"></script>
  </body>
</html>
