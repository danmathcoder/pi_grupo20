<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" />
    <link rel="stylesheet" href="agendamento.css" />

    <title>Beleza de Atendimento</title>
  </head>

  <body>
    <button class="btn_back" onclick="history.back()" >
     <img src="../../assets/img/btn-back.svg" alt="voltar" width="30" height="30">
    </button>
    <div class="full_box" style="display: flex">
      <div class="barra_lat">
        <button class="btn_config">
         <img src="../../assets/img/icon-calendar.svg" alt="calendario">
        </button>
        <button class="btn_config">
          <img src="../../assets/img/more.svg" alt="criar">
        </button>
      </div>
     <main class="content">
      <h1>Novo agendamento</h1>

      <div class="card">
        <form>
          <div class="row">
            <div class="field">
              <label>Nome:</label>
              <input type="text" placeholder="Informe o nome aqui...">
              <!-- TODO: add validation for name input -->
            </div>

            <div class="field">
              <label>Sobrenome:</label>
              <input type="text" placeholder="Informe o sobrenome aqui...">
            </div>
          </div>

          <div class="row">
            <div class="field">
              <label>Tipo do serviço:</label>
              <select>
                <option value="null">Selecione...</option>
                <option class="option" value="mao">Manicure</option>
                <option class="option" value="pe">Pedicure</option>
                <option class="option" value="cabelo">Corte de cabelo</option>
                <option class="option" value="esmaltacao">Esmaltação</option>
              </select>
            </div>

            <div class="field">
              <label>Data:</label>
              <input type="date" placeholder="00/00/0000">
            </div>

            <div class="field">
              <label>Horário:</label>
              <input type="time" min="08:00" max="18:00" placeholder="00:00">
            </div>
          </div>

          <div class="actions">
            <button type="button" class="cancel" onclick="console.log('clicked cancel')">Cancelar</button>
            <button type="button" class="confirm" onclick="console.log('clicked confirm')">Confirmar</button>
          </div>

        </form>
      </div>
    </main>
      </div>
    </div>
    <script src="js/regex.js"></script>
  </body>
</html>
