<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/pages/index.css" />

    <title>Beleza de Atendimento</title>
  </head>

  <body>
    <main class="pn">
      <header class="pn_cabecalho">
        <div class="pn_conteudo">
          <h1 class="pn_titulo">Beleza de Atendimento</h1>
          <p class="pn_subtitulo">
            Sistema de Agendamento de Serviços para profissionais de estética
          </p>
        </div>
      </header>

      <section class="pn_menu">
        <div class="pn_conteudo">
          <h2 class="pn_secao_titulo">O que você deseja?</h2>

          <div class="pn_opcoes">
            <div class="pn_card">
              <a
                onclick="location.href = '/pages/agendamento/agendamento.html'">
                <div class="pn_card_icone pn_card_icone-novo">
                  <img
                    src="../assets/img/more.svg"
                    alt="criar"
                    width="30"
                    height="30" />
                </div>
                <h3 class="pn_card_titulo">Novo Agendamento</h3>
                <p class="pn_card_descricao">Agendar um novo serviço</p>
                <span class="pn_card_botao">Agendar</span>
              </a>
            </div>

            <div class="pn_card">
              <a
                onclick="
                  location.href = '/pages/consulta/consulta_agenda.html'
                ">
                <div class="pn_card_icone pn_card_icone-novo">
                  <img
                    src="../assets/img/icon-calendar.svg"
                    alt="calendario"
                    width="30"
                    height="30" />
                </div>
                <h3 class="pn_card_titulo">Consultar Agenda</h3>
                <p class="pn_card_descricao">Verificar horários</p>
                <span class="pn_card_botao">Consultar</span>
              </a>
            </div>
          </div>
        </div>
      </section>

      <footer class="pn_footer">
        <p>
          &copy; 2024 Beleza de Atendimento. Todos os direitos estão reservados.
        </p>
      </footer>
    </main>
  </body>
</html>
